<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#10171a" />
<title>War Simulator</title>
<style>
:root{color-scheme:dark;--panel:rgba(8,13,16,.76);--line:rgba(255,255,255,.14);--accent:#ead99d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#64787c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;color:#f6f2e7}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);box-shadow:0 10px 32px rgba(0,0,0,.25)}
.supply{position:absolute;top:12px;right:12px;width:170px;padding:9px 10px}.row{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:800}.bar{height:6px;margin-top:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.bar>div{height:100%;width:0;background:var(--accent)}
.selection{position:absolute;top:12px;left:12px;display:none;padding:8px 10px;min-width:150px;font-size:11px}.selection.active{display:block}.selection strong{display:block;font-size:12px;margin-bottom:2px}.state{opacity:.72}
.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;align-items:flex-end;gap:10px}.controls{position:absolute;left:12px;bottom:12px;padding:8px 10px;font-size:10px;line-height:1.45;opacity:.72}
button{pointer-events:auto;border:0;border-radius:10px;padding:13px 22px;min-width:190px;background:var(--accent);color:#11171a;font-weight:900;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}
.toast{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);padding:8px 12px;font-size:11px;font-weight:800;opacity:0;transition:opacity .16s;white-space:nowrap}.toast.show{opacity:1}
#pcGate{position:fixed;inset:0;z-index:20;background:#0d1316;color:#eee;display:none;place-items:center;text-align:center;padding:28px}#pcGate.active{display:grid}#pcGate strong{display:block;font-size:24px;margin-bottom:8px}#pcGate span{font-size:13px;opacity:.62}
.crosshair{position:absolute;width:18px;height:18px;border:1px solid rgba(255,224,139,.9);border-radius:50%;transform:translate(-50%,-50%);display:none}.crosshair::before,.crosshair::after{content:"";position:absolute;background:rgba(255,224,139,.9)}.crosshair::before{width:8px;height:1px;left:4px;top:8px}.crosshair::after{height:8px;width:1px;left:8px;top:4px}
</style>
</head>
<body>
<div id="pcGate"><div><strong>PC専用</strong><span>マウスとキーボードでプレイしてください。</span></div></div>
<div id="game"></div>
<div class="hud">
  <div class="supply panel"><div class="row"><span>補給</span><span id="supplyText">0 / 500</span></div><div class="bar"><div id="supplyFill"></div></div></div>
  <div id="selection" class="selection panel"><strong id="selectionTitle"></strong><span id="selectionMeta"></span><div id="selectionState" class="state"></div></div>
  <div id="toast" class="toast panel"></div><div id="crosshair" class="crosshair"></div>
  <div class="controls panel">WASD: 移動　Shift: 高速<br>右ドラッグ: 視点　ホイール: ズーム<br>左クリック: 移動　ダブルクリック: 一斉射撃</div>
  <div class="bottom"><button id="deployBtn" disabled>歩兵中隊　100</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const isPC=matchMedia('(pointer:fine)').matches&&innerWidth>=900;
if(!isPC){document.getElementById('pcGate').classList.add('active');}
else init();

function init(){
const game=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;game.appendChild(renderer.domElement);
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0xaab4af,.0038);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,600);
const camTarget=new THREE.Vector3(0,4,8);let camYaw=0,camPitch=.68,camDistance=105;
function updateCamera(){camPitch=THREE.MathUtils.clamp(camPitch,.22,1.42);camDistance=THREE.MathUtils.clamp(camDistance,18,165);const cp=Math.cos(camPitch);camera.position.set(camTarget.x+Math.sin(camYaw)*cp*camDistance,camTarget.y+Math.sin(camPitch)*camDistance,camTarget.z+Math.cos(camYaw)*cp*camDistance);camera.lookAt(camTarget)}
updateCamera();

const sky=new THREE.Mesh(new THREE.SphereGeometry(420,24,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Color(0x6f8b97)},bottom:{value:new THREE.Color(0xd6d0b9)}},vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`uniform vec3 top;uniform vec3 bottom;varying vec3 vP;void main(){float h=normalize(vP).y*.5+.5;gl_FragColor=vec4(mix(bottom,top,smoothstep(.15,.9,h)),1.0);}`}));scene.add(sky);
scene.add(new THREE.HemisphereLight(0xdce8e7,0x453f31,1.55));const sun=new THREE.DirectionalLight(0xffe8bd,2.7);sun.position.set(-65,105,42);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-110;sun.shadow.camera.right=110;sun.shadow.camera.top=110;sun.shadow.camera.bottom=-110;sun.shadow.bias=-.0005;scene.add(sun);

const MAP=128,COAST=7;
function heightAt(x,z){if(z<COAST)return 0;const inland=z-COAST;return 1.0+Math.min(9,inland*.145)+Math.sin(x*.105)*.65+Math.sin(z*.083+x*.037)*.48+Math.cos(x*.041-z*.062)*.36+Math.sin(x*.19+z*.11)*.16}

const waterMat=new THREE.ShaderMaterial({transparent:false,uniforms:{time:{value:0},deep:{value:new THREE.Color(0x244f61)},light:{value:new THREE.Color(0x557c82)}},vertexShader:`varying vec2 vUv;uniform float time;void main(){vUv=uv;vec3 p=position;p.z+=sin((p.x+time*7.0)*.11)*.12+cos((p.y-time*5.0)*.15)*.08;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float time;uniform vec3 deep;uniform vec3 light;void main(){float w=.5+.5*sin(vUv.x*70.0+time*1.7+sin(vUv.y*48.0));vec3 c=mix(deep,light,.18+w*.12);gl_FragColor=vec4(c,1.0);}`});
const water=new THREE.Mesh(new THREE.PlaneGeometry(MAP,75,48,26).rotateX(-Math.PI/2),waterMat);water.position.set(0,-.18,-34);water.receiveShadow=true;scene.add(water);
const beachMat=new THREE.MeshStandardMaterial({color:0xb7a376,roughness:.98});const beach=new THREE.Mesh(new THREE.PlaneGeometry(MAP,20).rotateX(-Math.PI/2),beachMat);beach.position.set(0,.02,0);beach.receiveShadow=true;beach.userData.ground=true;scene.add(beach);

const landGeo=new THREE.PlaneGeometry(MAP,72,80,48);landGeo.rotateX(-Math.PI/2);const p=landGeo.attributes.position;const colors=[];const c=new THREE.Color();
for(let i=0;i<p.count;i++){const x=p.getX(i),lz=p.getZ(i),wz=lz+42,y=heightAt(x,wz);p.setY(i,y);const dirt=Math.max(0,Math.min(1,(y-1)/10));c.setRGB(.28+.09*(1-dirt),.36+.1*(1-dirt),.19+.05*(1-dirt));const noise=(Math.sin(x*1.7+wz*.9)+1)*.018;c.offsetHSL(0,0,noise);colors.push(c.r,c.g,c.b)}landGeo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));landGeo.computeVertexNormals();
const land=new THREE.Mesh(landGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));land.position.set(0,0,42);land.receiveShadow=true;land.userData.ground=true;scene.add(land);

for(let i=0;i<5;i++){const foam=new THREE.Mesh(new THREE.PlaneGeometry(MAP*.97,.18).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xe7ebe4,transparent:true,opacity:.28+Math.random()*.16}));foam.position.set(0,.055,-6.7-i*2.2);scene.add(foam)}

const hedgeMat=new THREE.MeshStandardMaterial({color:0x284126,roughness:1});function hedge(x,z,w,d,r=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,2.4,d,Math.max(1,Math.round(w/3)),1,1),hedgeMat);m.position.set(x,heightAt(x,z)+1.15,z);m.rotation.y=r;m.castShadow=true;m.receiveShadow=true;scene.add(m)}
for(const z of [23,39,56,70]){hedge(-32,z,37,1.6,.04);hedge(29,z+3,43,1.6,-.06)}for(const x of [-43,-15,16,45])hedge(x,49,1.5,48,0);
const roadMat=new THREE.MeshStandardMaterial({color:0x6f685b,roughness:1});function road(x,z,w,d,r=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d).rotateX(-Math.PI/2),roadMat);m.position.set(x,heightAt(x,z)+.07,z);m.rotation.y=r;m.receiveShadow=true;scene.add(m)}road(-6,41,4.5,67,.08);road(30,49,3.6,48,-.4);

function tree(x,z,s=.9){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,2.2*s,6),new THREE.MeshStandardMaterial({color:0x4a3825,roughness:1}));trunk.position.y=1.1*s;trunk.castShadow=true;g.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6*s,1),new THREE.MeshStandardMaterial({color:0x39533a,roughness:1}));crown.position.y=3*s;crown.scale.set(1,1.25,1);crown.castShadow=true;g.add(crown);g.position.set(x,heightAt(x,z),z);scene.add(g)}
for(let i=0;i<55;i++){const z=16+Math.random()*66,x=-59+Math.random()*118;if(Math.abs(x+6)<5||Math.random()<.22)continue;tree(x,z,.55+Math.random()*.65)}
function crater(x,z,s=1){const m=new THREE.Mesh(new THREE.RingGeometry(.5*s,1.8*s,18).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x423b2f,roughness:1,side:THREE.DoubleSide}));m.position.set(x,(z<COAST?.06:heightAt(x,z)+.06),z);m.rotation.z=Math.random()*Math.PI;scene.add(m)}for(let i=0;i<26;i++)crater(-55+Math.random()*110,-4+Math.random()*26,.6+Math.random()*.8);
function obstacle(x,z,r=0){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x414641,roughness:.72,metalness:.35});for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.22,3.4,.22),mat);b.rotation.z=i*Math.PI/3;b.castShadow=true;g.add(b)}g.position.set(x,.8,z);g.rotation.y=r;scene.add(g)}for(let i=0;i<22;i++)obstacle(-57+i*5.3,-2-(i%3)*3,Math.random());
function bunker(x,z){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0x5d6058,roughness:1});const base=new THREE.Mesh(new THREE.BoxGeometry(8,2.8,5),mat);base.position.y=1.4;base.castShadow=true;g.add(base);const roof=new THREE.Mesh(new THREE.BoxGeometry(9,.65,6),mat);roof.position.y=2.95;roof.castShadow=true;g.add(roof);const slit=new THREE.Mesh(new THREE.BoxGeometry(4,.45,.24),new THREE.MeshBasicMaterial({color:0x151716}));slit.position.set(0,1.65,-2.63);g.add(slit);g.position.set(x,heightAt(x,z),z);g.rotation.y=Math.PI;scene.add(g)}[-40,-14,17,44].forEach((x,i)=>bunker(x,12+Math.abs(i-1.5)*1.6));

function ship(x,z,s=1){const g=new THREE.Group();const hull=new THREE.Mesh(new THREE.BoxGeometry(13*s,1.8*s,3.5*s),new THREE.MeshStandardMaterial({color:0x343f43,roughness:.68,metalness:.2}));hull.position.y=.75*s;hull.castShadow=true;g.add(hull);const deck=new THREE.Mesh(new THREE.BoxGeometry(10*s,.3*s,3*s),new THREE.MeshStandardMaterial({color:0x596164,roughness:.85}));deck.position.y=1.8*s;g.add(deck);const cabin=new THREE.Mesh(new THREE.BoxGeometry(3*s,2.1*s,2.2*s),new THREE.MeshStandardMaterial({color:0x4a5559,roughness:.75}));cabin.position.set(1.2*s,2.7*s,0);cabin.castShadow=true;g.add(cabin);g.position.set(x,0,z);scene.add(g)}ship(0,-55,1.65);ship(-35,-49,.82);ship(33,-57,.9);ship(49,-45,.68);

const companyTemplate={name:'U.S. Rifle Company',strength:193,officers:6,enlisted:187,cost:100};let supply=42,companySeq=0,selected=null;const companies=[],landings=[];
const deployBtn=document.getElementById('deployBtn'),supplyText=document.getElementById('supplyText'),supplyFill=document.getElementById('supplyFill'),selection=document.getElementById('selection'),selectionTitle=document.getElementById('selectionTitle'),selectionMeta=document.getElementById('selectionMeta'),selectionState=document.getElementById('selectionState'),toast=document.getElementById('toast'),crosshair=document.getElementById('crosshair');
function notify(t){toast.textContent=t;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),950)}function updateSupply(){supply=Math.min(500,supply);const n=Math.floor(supply);supplyText.textContent=`${n} / 500`;supplyFill.style.width=`${supply/5}%`;deployBtn.disabled=supply<100}

function landingCraft(x,z){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x666c63,roughness:.9});const hull=new THREE.Mesh(new THREE.BoxGeometry(4.2,1.1,7.2),mat);hull.position.y=.45;hull.castShadow=true;g.add(hull);const bay=new THREE.Mesh(new THREE.BoxGeometry(3.1,.25,4.8),new THREE.MeshStandardMaterial({color:0x343a35,roughness:1}));bay.position.set(0,1.03,.1);g.add(bay);for(let i=0;i<10;i++){const man=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.34,3,5),new THREE.MeshStandardMaterial({color:0x536249,roughness:1}));man.position.set(((i%2)*2-1)*.58,1.12,(Math.floor(i/2)-2)*.78);g.add(man)}g.position.set(x,0,z);scene.add(g);return g}

const geoTorso=new THREE.BoxGeometry(.38,.65,.24),geoHead=new THREE.SphereGeometry(.17,7,6),geoHelmet=new THREE.SphereGeometry(.205,8,6,0,Math.PI*2,0,Math.PI*.63),geoLimb=new THREE.CylinderGeometry(.055,.07,.55,5),geoLeg=new THREE.CylinderGeometry(.065,.08,.66,5),geoWeaponBody=new THREE.BoxGeometry(.11,.11,.72),geoBarrel=new THREE.CylinderGeometry(.027,.027,.72,5);
const matUniform=new THREE.MeshStandardMaterial({color:0x59684d,roughness:.94}),matSkin=new THREE.MeshStandardMaterial({color:0xb98e68,roughness:1}),matHelmet=new THREE.MeshStandardMaterial({color:0x4b5943,roughness:.9}),matBoot=new THREE.MeshStandardMaterial({color:0x343126,roughness:1}),matWeapon=new THREE.MeshStandardMaterial({color:0x3a3026,roughness:.72,metalness:.08}),matMetal=new THREE.MeshStandardMaterial({color:0x242729,roughness:.42,metalness:.5});
const dummy=new THREE.Object3D();function setInst(mesh,i,x,y,z,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){dummy.position.set(x,y,z);dummy.rotation.set(rx,ry,rz);dummy.scale.set(sx,sy,sz);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix)}
function makeCompany(id,x,z){const root=new THREE.Group();root.userData.type='company';root.userData.id=id;const N=193;const meshes={torso:new THREE.InstancedMesh(geoTorso,matUniform,N),head:new THREE.InstancedMesh(geoHead,matSkin,N),helmet:new THREE.InstancedMesh(geoHelmet,matHelmet,N),la:new THREE.InstancedMesh(geoLimb,matUniform,N),ra:new THREE.InstancedMesh(geoLimb,matUniform,N),ll:new THREE.InstancedMesh(geoLeg,matBoot,N),rl:new THREE.InstancedMesh(geoLeg,matBoot,N),gun:new THREE.InstancedMesh(geoWeaponBody,matWeapon,N),barrel:new THREE.InstancedMesh(geoBarrel,matMetal,N)};Object.values(meshes).forEach(m=>{m.castShadow=true;m.receiveShadow=true;m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);root.add(m)});
const soldiers=[];let index=0;for(let row=0;row<14&&index<N;row++){for(let col=0;col<14&&index<N;col++,index++){const jitter=(index*17%13)/130;const sx=(col-6.5)*.72+(row%2)*.18+jitter,sz=(row-6.5)*.8+((index*7)%9)/90;let weapon='M1 Garand';if(index%22===0)weapon='BAR';else if(index%31===0||index<6)weapon='Thompson';soldiers.push({x:sx,z:sz,phase:Math.random()*Math.PI*2,weapon,nextShot:0,lastShot:-999})}}
const ring=new THREE.Mesh(new THREE.RingGeometry(8.2,8.55,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xf2dc94,transparent:true,opacity:.82,side:THREE.DoubleSide}));ring.position.y=.08;ring.visible=false;root.add(ring);root.position.set(x,heightAt(x,z),z);Object.assign(root.userData,{ring,target:new THREE.Vector3(x,heightAt(x,z),z),speed:4.4,state:'idle',attackPoint:null,fireUntil:0,meshes,soldiers,meta:{...companyTemplate,id}});scene.add(root);companies.push(root);updateSoldierInstances(root,0,0);return root}
function updateSoldierInstances(root,now,motion){const {meshes,soldiers,state}=root.userData;const firing=state==='fire'&&now<root.userData.fireUntil;for(let i=0;i<soldiers.length;i++){const s=soldiers[i],walk=motion>0?Math.sin(now*.008+s.phase):0,bob=motion>0?Math.abs(Math.sin(now*.008+s.phase))*.045:Math.sin(now*.0018+s.phase)*.008,recoil=Math.max(0,1-(now-s.lastShot)/95);const y=bob;setInst(meshes.torso,i,s.x,.98+y,s.z,recoil*.03,0,0,1,1,1);setInst(meshes.head,i,s.x,1.48+y,s.z-.01);setInst(meshes.helmet,i,s.x,1.61+y,s.z-.01,0,0,0,1.08,.82,1.08);const legSwing=walk*.48;setInst(meshes.ll,i,s.x-.11,.41+y,s.z,legSwing,0,0);setInst(meshes.rl,i,s.x+.11,.41+y,s.z,-legSwing,0,0);let armL=-walk*.42,armR=walk*.42;if(firing){armL=1.08;armR=1.16}setInst(meshes.la,i,s.x-.27,1.03+y,s.z-.05,armL,0,.05);setInst(meshes.ra,i,s.x+.27,1.03+y,s.z-.05,armR,0,-.05);let bodyScale=1,gunLen=1;if(s.weapon==='BAR'){bodyScale=1.3;gunLen=1.25}else if(s.weapon==='Thompson'){bodyScale=1.12;gunLen=.7}setInst(meshes.gun,i,s.x+.05,1.15+y,s.z-.43+recoil*.06,0,0,0,bodyScale,bodyScale,gunLen);setInst(meshes.barrel,i,s.x+.05,1.15+y,s.z-.88*gunLen+recoil*.06,Math.PI/2,0,0,1,gunLen,1)}Object.values(meshes).forEach(m=>m.instanceMatrix.needsUpdate=true)}

const MAX_SHOTS=420;const tracerPos=new Float32Array(MAX_SHOTS*2*3);for(let i=0;i<tracerPos.length;i++)tracerPos[i]=-999;const tracerGeo=new THREE.BufferGeometry();tracerGeo.setAttribute('position',new THREE.BufferAttribute(tracerPos,3));const tracers=new THREE.LineSegments(tracerGeo,new THREE.LineBasicMaterial({color:0xffd36d,transparent:true,opacity:.78}));scene.add(tracers);const flashPos=new Float32Array(MAX_SHOTS*3);for(let i=0;i<flashPos.length;i++)flashPos[i]=-999;const flashGeo=new THREE.BufferGeometry();flashGeo.setAttribute('position',new THREE.BufferAttribute(flashPos,3));const flashes=new THREE.Points(flashGeo,new THREE.PointsMaterial({color:0xffd56c,size:.16,sizeAttenuation:true,transparent:true,opacity:.95}));scene.add(flashes);const shotLife=new Float32Array(MAX_SHOTS);let shotCursor=0;
function spawnShot(root,s,target,now){const slot=shotCursor++%MAX_SHOTS;const muzzle=new THREE.Vector3(s.x+.05,1.16,s.z-(s.weapon==='Thompson'?.7:s.weapon==='BAR'?1.18:.94));root.localToWorld(muzzle);const aim=target.clone();aim.x+=(Math.random()-.5)*3.2;aim.y+=.5+Math.random()*1.6;aim.z+=(Math.random()-.5)*3.2;const dir=aim.sub(muzzle).normalize();const length=8+Math.random()*9;const end=muzzle.clone().addScaledVector(dir,length);let k=slot*6;tracerPos[k]=muzzle.x;tracerPos[k+1]=muzzle.y;tracerPos[k+2]=muzzle.z;tracerPos[k+3]=end.x;tracerPos[k+4]=end.y;tracerPos[k+5]=end.z;k=slot*3;flashPos[k]=muzzle.x;flashPos[k+1]=muzzle.y;flashPos[k+2]=muzzle.z;shotLife[slot]=now+65;tracerGeo.attributes.position.needsUpdate=true;flashGeo.attributes.position.needsUpdate=true;s.lastShot=now}
function updateShots(now){let dirty=false;for(let i=0;i<MAX_SHOTS;i++){if(shotLife[i]&&now>shotLife[i]){shotLife[i]=0;let k=i*6;for(let j=0;j<6;j++)tracerPos[k+j]=-999;k=i*3;for(let j=0;j<3;j++)flashPos[k+j]=-999;dirty=true}}if(dirty){tracerGeo.attributes.position.needsUpdate=true;flashGeo.attributes.position.needsUpdate=true}}

function deployCompany(){if(supply<100)return;supply-=100;updateSupply();const id=++companySeq,craft=[];for(let i=0;i<6;i++)craft.push(landingCraft(-11+i*4.4,-58-(i%2)*3.2));landings.push({id,craft,t:0,phase:'sea',beachX:-27+((id*19)%54)});notify(`第${id}中隊 上陸開始`)}deployBtn.addEventListener('click',deployCompany);
function selectCompany(c){if(selected?.userData.ring)selected.userData.ring.visible=false;selected=c;c.userData.ring.visible=true;selection.classList.add('active');selectionTitle.textContent=`第${c.userData.id}中隊`;selectionMeta.textContent='193名';refreshState()}
function refreshState(){if(!selected)return;const s=selected.userData.state;selectionState.textContent=s==='fire'?'攻撃中':s==='move'?'移動中':'待機'}
function orderMove(point){if(!selected)return;selected.userData.target.set(point.x,heightAt(point.x,point.z),point.z);selected.userData.state='move';selected.userData.attackPoint=null;refreshState();notify(`第${selected.userData.id}中隊 移動`)}
function orderAttack(point,screenX,screenY){if(!selected)return;selected.userData.attackPoint=point.clone();selected.userData.state='fire';selected.userData.fireUntil=performance.now()+5200;const d=point.clone().sub(selected.position);selected.rotation.y=Math.atan2(d.x,d.z);refreshState();crosshair.style.left=`${screenX}px`;crosshair.style.top=`${screenY}px`;crosshair.style.display='block';clearTimeout(orderAttack.t);orderAttack.t=setTimeout(()=>crosshair.style.display='none',900);notify(`第${selected.userData.id}中隊 一斉射撃`)}

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();function rayFromEvent(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera)}function pickGround(e){rayFromEvent(e);return raycaster.intersectObjects([land,beach],false)[0]?.point||null}
let rightDrag=false,lastMouse={x:0,y:0},clickTimer=0;
renderer.domElement.addEventListener('mousedown',e=>{lastMouse={x:e.clientX,y:e.clientY};if(e.button===2)rightDrag=true});
addEventListener('mouseup',e=>{if(e.button===2)rightDrag=false});addEventListener('mousemove',e=>{if(!rightDrag)return;const dx=e.clientX-lastMouse.x,dy=e.clientY-lastMouse.y;lastMouse={x:e.clientX,y:e.clientY};camYaw-=dx*.006;camPitch+=dy*.0045;updateCamera()});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camDistance+=e.deltaY*.055;updateCamera()},{passive:false});
renderer.domElement.addEventListener('click',e=>{if(e.button!==0)return;rayFromEvent(e);const hits=raycaster.intersectObjects(companies,true);if(hits.length){let o=hits[0].object;while(o.parent&&o.userData.type!=='company')o=o.parent;if(o.userData.type==='company'){clearTimeout(clickTimer);selectCompany(o);return}}const p=raycaster.intersectObjects([land,beach],false)[0]?.point;if(!p||!selected)return;clearTimeout(clickTimer);clickTimer=setTimeout(()=>orderMove(p),230)});
renderer.domElement.addEventListener('dblclick',e=>{if(e.button!==0||!selected)return;clearTimeout(clickTimer);const p=pickGround(e);if(p)orderAttack(p,e.clientX,e.clientY)});

const keys=new Set();addEventListener('keydown',e=>{keys.add(e.code);if(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));function updateFreeCamera(dt){let f=0,r=0;if(keys.has('KeyW'))f+=1;if(keys.has('KeyS'))f-=1;if(keys.has('KeyD'))r+=1;if(keys.has('KeyA'))r-=1;if(keys.has('KeyQ'))camYaw+=dt*1.1;if(keys.has('KeyE'))camYaw-=dt*1.1;if(!f&&!r&&!keys.has('KeyQ')&&!keys.has('KeyE'))return;const speed=(keys.has('ShiftLeft')||keys.has('ShiftRight')?40:18)*dt;const forward=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw)),right=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));camTarget.addScaledVector(forward,f*speed).addScaledVector(right,r*speed);camTarget.x=THREE.MathUtils.clamp(camTarget.x,-62,62);camTarget.z=THREE.MathUtils.clamp(camTarget.z,-66,78);camTarget.y=Math.max(0,heightAt(camTarget.x,camTarget.z));updateCamera()}

function updateLandings(dt){for(let i=landings.length-1;i>=0;i--){const g=landings[i];g.t+=dt;if(g.phase==='sea'){const t=Math.min(1,g.t/9.2),s=t*t*(3-2*t);g.craft.forEach((c,j)=>{const sx=-11+j*4.4,sz=-58-(j%2)*3.2;c.position.x=THREE.MathUtils.lerp(sx,g.beachX+(j-2.5)*2.2,s);c.position.z=THREE.MathUtils.lerp(sz,-7+(j%2)*1.0,s)});if(t>=1){g.phase='unload';g.t=0;g.unit=makeCompany(g.id,g.beachX,1.6);g.unit.scale.setScalar(.02)}}else{const t=Math.min(1,g.t/1.7);g.unit.scale.setScalar(.02+.98*t);g.craft.forEach(c=>c.position.z-=dt*4.4);if(t>=1){g.craft.forEach(c=>scene.remove(c));landings.splice(i,1);notify(`第${g.id}中隊 上陸完了`)}}}}
function updateCompanies(dt,now){for(const c of companies){let motion=0;if(c.userData.state==='move'){const d=new THREE.Vector3(c.userData.target.x-c.position.x,0,c.userData.target.z-c.position.z),dist=d.length();if(dist>.35){d.normalize();c.position.addScaledVector(d,Math.min(dist,c.userData.speed*dt));c.rotation.y=Math.atan2(d.x,d.z);c.position.y=heightAt(c.position.x,c.position.z);motion=1}else{c.userData.state='idle';if(c===selected)refreshState()}}if(c.userData.state==='fire'){if(now>=c.userData.fireUntil){c.userData.state='idle';if(c===selected)refreshState()}else{const target=c.userData.attackPoint;c.userData.soldiers.forEach(s=>{if(now>=s.nextShot){spawnShot(c,s,target,now);const base=s.weapon==='BAR'?.13:s.weapon==='Thompson'?.095:.48;s.nextShot=now+(base+Math.random()*base*.9)*1000}})}}updateSoldierInstances(c,now,motion)}}

let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;supply+=dt*9;updateSupply();waterMat.uniforms.time.value=now*.001;updateFreeCamera(dt);updateLandings(dt);updateCompanies(dt,now);updateShots(now);renderer.render(scene,camera)}updateSupply();requestAnimationFrame(loop);
addEventListener('resize',()=>{if(innerWidth<900){document.getElementById('pcGate').classList.add('active');return}camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}
</script>
</body>
