<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1319" />
  <title>War Simulator</title>
  <style>
    :root{color-scheme:dark;--panel:rgba(9,16,21,.78);--line:rgba(255,255,255,.13);--accent:#ead89d}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78909a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #game{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .hud{position:fixed;inset:0;pointer-events:none;color:#fff}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 8px 22px rgba(0,0,0,.2)}
    .supply{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;width:155px;padding:9px 10px}
    .supply-row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;font-weight:800}
    .bar{height:6px;margin-top:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
    .bar>div{height:100%;width:0;background:var(--accent)}
    .selection{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;padding:8px 10px;font-size:11px;display:none;max-width:220px}
    .selection.active{display:block}
    .selection strong{display:block;font-size:12px;margin-bottom:2px}
    .bottom{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center}
    button{pointer-events:auto;border:0;border-radius:12px;padding:13px 18px;min-width:180px;color:#0d1418;background:var(--accent);font-weight:900;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
    button:disabled{opacity:.4;filter:grayscale(.5)}
    .toast{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);padding:8px 12px;font-size:11px;font-weight:800;opacity:0;transition:opacity .18s;white-space:nowrap}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="hud">
    <div class="supply panel">
      <div class="supply-row"><span>補給</span><span id="supplyText">0 / 500</span></div>
      <div class="bar"><div id="supplyFill"></div></div>
    </div>
    <div id="selection" class="selection panel">
      <strong id="selectionTitle"></strong>
      <span id="selectionMeta"></span>
    </div>
    <div id="toast" class="toast panel"></div>
    <div class="bottom"><button id="deployBtn" disabled>歩兵中隊　100</button></div>
  </div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const game = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
game.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xaab8b7);
scene.fog=new THREE.FogExp2(0x9ca9a8,.0043);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,420);
const camTarget=new THREE.Vector3(0,0,-12);
let camYaw=0,camPitch=.62,camDistance=118;
function updateCamera(){
  camPitch=THREE.MathUtils.clamp(camPitch,.28,1.32);
  camDistance=THREE.MathUtils.clamp(camDistance,34,150);
  const cp=Math.cos(camPitch);
  camera.position.set(
    camTarget.x+Math.sin(camYaw)*cp*camDistance,
    camTarget.y+Math.sin(camPitch)*camDistance,
    camTarget.z+Math.cos(camYaw)*cp*camDistance
  );
  camera.lookAt(camTarget);
}
updateCamera();

scene.add(new THREE.HemisphereLight(0xe4ece9,0x4a4538,1.8));
const sun=new THREE.DirectionalLight(0xfff0d1,2.2);
sun.position.set(-45,82,30);
sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);
sun.shadow.camera.left=-95;sun.shadow.camera.right=95;sun.shadow.camera.top=95;sun.shadow.camera.bottom=-95;
scene.add(sun);

const MAP=120;
const COAST=7;
function heightAt(x,z){
  if(z<COAST) return 0;
  const inland=z-COAST;
  return 1.1+Math.min(7.8,inland*.15)+Math.sin(x*.11)*.65+Math.sin(z*.08+x*.035)*.45+Math.cos(x*.04-z*.06)*.35;
}

const seabed=new THREE.Mesh(
  new THREE.PlaneGeometry(MAP,66).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x315e70,roughness:.34,metalness:.03,transparent:true,opacity:.95})
);
seabed.position.set(0,-.12,-33);scene.add(seabed);

const beach=new THREE.Mesh(
  new THREE.PlaneGeometry(MAP,18).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color:0xb9a97d,roughness:1})
);
beach.position.set(0,.04,0);beach.receiveShadow=true;beach.userData.ground=true;scene.add(beach);

const landGeo=new THREE.PlaneGeometry(MAP,62,64,36);landGeo.rotateX(-Math.PI/2);
const lp=landGeo.attributes.position;
for(let i=0;i<lp.count;i++){
  const x=lp.getX(i), localZ=lp.getZ(i), worldZ=localZ+40;
  lp.setY(i,heightAt(x,worldZ));
}
landGeo.computeVertexNormals();
const land=new THREE.Mesh(landGeo,new THREE.MeshStandardMaterial({color:0x6a7952,roughness:1}));
land.position.set(0,0,40);land.receiveShadow=true;land.userData.ground=true;scene.add(land);

for(let i=0;i<4;i++){
  const foam=new THREE.Mesh(new THREE.PlaneGeometry(MAP*.94,.22).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xe7ece9,transparent:true,opacity:.45}));
  foam.position.set(0,.065,-7-i*2.1);scene.add(foam);
}

const hedgeMat=new THREE.MeshStandardMaterial({color:0x30472c,roughness:1});
function hedge(x,z,w,d,rot=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,2.2,d),hedgeMat);m.position.set(x,heightAt(x,z)+1.1,z);m.rotation.y=rot;m.castShadow=true;m.receiveShadow=true;scene.add(m);
}
for(const z of [24,40,57]){hedge(-31,z,36,1.4,.05);hedge(30,z+3,40,1.4,-.07)}
for(const x of [-39,-13,18,43]) hedge(x,48,1.4,43,0);

const roadMat=new THREE.MeshStandardMaterial({color:0x777064,roughness:1});
function road(x,z,w,d,rot=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d).rotateX(-Math.PI/2),roadMat);m.position.set(x,heightAt(x,z)+.08,z);m.rotation.y=rot;m.receiveShadow=true;scene.add(m)}
road(-5,38,4,58,.08);road(29,47,3.2,43,-.4);

function bunker(x,z){
  const g=new THREE.Group();
  const concrete=new THREE.MeshStandardMaterial({color:0x66685f,roughness:1});
  const base=new THREE.Mesh(new THREE.BoxGeometry(8,2.7,5),concrete);base.position.y=1.35;base.castShadow=true;g.add(base);
  const slit=new THREE.Mesh(new THREE.BoxGeometry(4.2,.42,.22),new THREE.MeshBasicMaterial({color:0x181a18}));slit.position.set(0,1.45,-2.61);g.add(slit);
  g.position.set(x,heightAt(x,z),z);g.rotation.y=Math.PI;scene.add(g);
}
[-38,-12,18,43].forEach((x,i)=>bunker(x,12+Math.abs(i-1.5)*1.7));

function ship(x,z,s=1){
  const g=new THREE.Group();
  const hull=new THREE.Mesh(new THREE.BoxGeometry(13*s,1.8*s,3.4*s),new THREE.MeshStandardMaterial({color:0x3b464b,roughness:.75,metalness:.18}));hull.position.y=.75*s;hull.castShadow=true;g.add(hull);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(3.2*s,2.2*s,2.3*s),new THREE.MeshStandardMaterial({color:0x515c60,roughness:.75}));cabin.position.set(1.5*s,2.25*s,0);cabin.castShadow=true;g.add(cabin);
  g.position.set(x,0,z);scene.add(g);return g;
}
ship(0,-51,1.55);ship(-34,-47,.8);ship(31,-53,.85);ship(48,-43,.68);

const companyTemplate={name:'U.S. Rifle Company',strength:193,officers:6,enlisted:187,cost:100};
let supply=35,companySeq=0,selected=null;
const companies=[],landings=[];
const deployBtn=document.getElementById('deployBtn');
const supplyText=document.getElementById('supplyText');
const supplyFill=document.getElementById('supplyFill');
const selection=document.getElementById('selection');
const selectionTitle=document.getElementById('selectionTitle');
const selectionMeta=document.getElementById('selectionMeta');
const toast=document.getElementById('toast');

function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),1000)}
function updateSupply(){supply=Math.min(500,supply);const n=Math.floor(supply);supplyText.textContent=`${n} / 500`;supplyFill.style.width=`${supply/5}%`;deployBtn.disabled=supply<companyTemplate.cost}

function landingCraft(x,z){
  const g=new THREE.Group();
  const hull=new THREE.Mesh(new THREE.BoxGeometry(3.8,1,6.6),new THREE.MeshStandardMaterial({color:0x666c63,roughness:.9}));hull.position.y=.42;hull.castShadow=true;g.add(hull);
  const bay=new THREE.Mesh(new THREE.BoxGeometry(2.8,.28,4.1),new THREE.MeshStandardMaterial({color:0x393e39,roughness:1}));bay.position.set(0,1,.15);g.add(bay);
  for(let i=0;i<4;i++){
    const man=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.42,3,6),new THREE.MeshStandardMaterial({color:0x58674b,roughness:1}));
    man.position.set((i%2?1:-1)*.55,1.05,(Math.floor(i/2)-.5)*1.2);g.add(man);
  }
  g.position.set(x,0,z);scene.add(g);return g;
}
function soldier(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.78,4,7),new THREE.MeshStandardMaterial({color:0x5e6d50,roughness:1}));body.position.y=.67;body.castShadow=true;g.add(body);
  const helmet=new THREE.Mesh(new THREE.SphereGeometry(.33,8,6,0,Math.PI*2,0,Math.PI*.62),new THREE.MeshStandardMaterial({color:0x535f45,roughness:1}));helmet.position.y=1.43;helmet.castShadow=true;g.add(helmet);return g;
}
function companyUnit(id,x,z){
  const root=new THREE.Group();root.userData.type='company';root.userData.id=id;
  [[-1.7,-1],[-.55,-1],[.55,-1],[1.7,-1],[-1.7,.2],[-.55,.2],[.55,.2],[1.7,.2],[-1.2,1.45],[0,1.45],[1.2,1.45]].forEach(p=>{const s=soldier();s.position.set(p[0],0,p[1]);root.add(s)});
  const ring=new THREE.Mesh(new THREE.RingGeometry(3.1,3.45,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xf1df9e,side:THREE.DoubleSide,transparent:true,opacity:.9}));ring.position.y=.08;ring.visible=false;root.add(ring);
  root.position.set(x,heightAt(x,z),z);root.userData.ring=ring;root.userData.target=new THREE.Vector3(x,heightAt(x,z),z);root.userData.speed=5.2;root.userData.meta={...companyTemplate,id};scene.add(root);companies.push(root);return root;
}

function deployCompany(){
  if(supply<companyTemplate.cost)return;
  supply-=companyTemplate.cost;updateSupply();
  const id=++companySeq;const craft=[];
  for(let i=0;i<6;i++)craft.push(landingCraft(-10+i*4,-54-(i%2)*3.5));
  landings.push({id,craft,t:0,phase:'sea',beachX:-26+((id*17)%52)});
  notify(`第${id}中隊 上陸開始`);
}
deployBtn.addEventListener('click',deployCompany);

function selectCompany(c){
  if(selected?.userData.ring)selected.userData.ring.visible=false;
  selected=c;c.userData.ring.visible=true;
  selection.classList.add('active');selectionTitle.textContent=`第${c.userData.id}中隊`;selectionMeta.textContent='193名';
}

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const activePointers=new Map();
let down={x:0,y:0},dragged=false,lastPinch=0;
renderer.domElement.addEventListener('pointerdown',e=>{
  renderer.domElement.setPointerCapture?.(e.pointerId);
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  down={x:e.clientX,y:e.clientY};dragged=false;lastPinch=0;
});
renderer.domElement.addEventListener('pointermove',e=>{
  const prev=activePointers.get(e.pointerId);if(!prev)return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[...activePointers.values()];
  if(pts.length===1){
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
    if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)dragged=true;
    camYaw-=dx*.006;camPitch+=dy*.0045;updateCamera();
  }else if(pts.length===2){
    dragged=true;const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    if(lastPinch)camDistance-=(d-lastPinch)*.18;lastPinch=d;updateCamera();
  }
});
renderer.domElement.addEventListener('pointerup',e=>{
  activePointers.delete(e.pointerId);lastPinch=0;
  if(dragged||Math.hypot(e.clientX-down.x,e.clientY-down.y)>9)return;
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);
  const unitHits=raycaster.intersectObjects(companies,true);
  if(unitHits.length){let o=unitHits[0].object;while(o.parent&&o.userData.type!=='company')o=o.parent;if(o.userData.type==='company'){selectCompany(o);return}}
  if(selected){const hit=raycaster.intersectObjects([land,beach],false)[0];if(hit){const p=hit.point;selected.userData.target.set(p.x,heightAt(p.x,p.z),p.z);notify(`第${selected.userData.id}中隊 移動`)}}
});
renderer.domElement.addEventListener('pointercancel',e=>{activePointers.delete(e.pointerId);lastPinch=0});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camDistance+=e.deltaY*.06;updateCamera()},{passive:false});

function updateLandings(dt){
  for(let i=landings.length-1;i>=0;i--){
    const g=landings[i];g.t+=dt;
    if(g.phase==='sea'){
      const t=Math.min(1,g.t/8.8),s=t*t*(3-2*t);
      g.craft.forEach((c,j)=>{const sx=-10+j*4,sz=-54-(j%2)*3.5;c.position.x=THREE.MathUtils.lerp(sx,g.beachX+(j-2.5)*2.1,s);c.position.z=THREE.MathUtils.lerp(sz,-7+(j%2)*1.1,s)});
      if(t>=1){g.phase='unload';g.t=0;g.unit=companyUnit(g.id,g.beachX,1.8);g.unit.scale.setScalar(.01)}
    }else{
      const t=Math.min(1,g.t/1.4);g.unit.scale.setScalar(.01+.99*t);g.craft.forEach(c=>c.position.z-=dt*4);
      if(t>=1){g.craft.forEach(c=>scene.remove(c));landings.splice(i,1);notify(`第${g.id}中隊 上陸完了`)}
    }
  }
}
function updateCompanies(dt){
  for(const c of companies){const target=c.userData.target;const d=new THREE.Vector3(target.x-c.position.x,0,target.z-c.position.z);const dist=d.length();if(dist>.3){d.normalize();c.position.addScaledVector(d,Math.min(dist,c.userData.speed*dt));c.rotation.y=Math.atan2(d.x,d.z);c.position.y=heightAt(c.position.x,c.position.z)}}
}

let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;supply+=dt*9;updateSupply();updateLandings(dt);updateCompanies(dt);renderer.render(scene,camera)}
updateSupply();requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
