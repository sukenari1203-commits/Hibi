<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1720" />
  <title>OVERLORD // Tactical Command</title>
  <style>
    :root { color-scheme: dark; --panel: rgba(10,18,24,.88); --line: rgba(255,255,255,.14); --accent:#e9d7a5; --green:#9ab58f; --red:#c56a5d; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#071018; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #game { position:fixed; inset:0; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .hud { position:fixed; inset:0; pointer-events:none; color:#f5f2e9; }
    .topbar { position:absolute; top:max(10px, env(safe-area-inset-top)); left:10px; right:10px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter: blur(10px); box-shadow:0 12px 30px rgba(0,0,0,.26); }
    .mission { padding:10px 12px; max-width:min(68vw,420px); }
    .eyebrow { font-size:10px; letter-spacing:.2em; opacity:.64; font-weight:800; }
    .mission h1 { margin:3px 0 2px; font-size:16px; letter-spacing:.03em; }
    .mission p { margin:0; font-size:11px; opacity:.72; line-height:1.35; }
    .supply { width:min(42vw,260px); padding:10px 12px; }
    .supply-row { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12px; font-weight:800; }
    .bar { margin-top:7px; height:8px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.08); }
    .bar > div { height:100%; width:0%; background:linear-gradient(90deg,#c9b87e,#efe1ac); transition:width .12s linear; }
    .selection { position:absolute; top:92px; left:10px; width:min(48vw,270px); padding:9px 11px; font-size:11px; display:none; }
    .selection.active { display:block; }
    .selection strong { display:block; font-size:12px; margin-bottom:2px; }
    .bottom { position:absolute; left:10px; right:10px; bottom:max(10px, env(safe-area-inset-bottom)); display:flex; justify-content:center; }
    .dock { pointer-events:auto; width:min(760px,100%); padding:10px; display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    .unit-card { min-width:0; }
    .unit-card .name { font-weight:900; font-size:13px; letter-spacing:.02em; }
    .unit-card .meta { font-size:10px; opacity:.62; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    button { pointer-events:auto; border:none; border-radius:12px; padding:12px 15px; min-width:126px; color:#071018; background:var(--accent); font-weight:900; font-size:12px; box-shadow:inset 0 -2px rgba(0,0,0,.12); }
    button:disabled { filter:grayscale(.7); opacity:.38; }
    .hint { position:absolute; right:10px; bottom:92px; padding:8px 10px; font-size:10px; line-height:1.4; opacity:.82; max-width:190px; }
    .toast { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:10px 14px; font-size:12px; font-weight:800; opacity:0; transition:opacity .2s; }
    .toast.show { opacity:1; }
    @media (max-width:620px){
      .mission p{display:none}.mission{max-width:54vw}.mission h1{font-size:14px}.supply{width:42vw}.selection{top:76px;width:58vw}.dock{grid-template-columns:1fr auto}.hint{display:none}
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="hud">
    <div class="topbar">
      <div class="mission panel">
        <div class="eyebrow">OPERATION OVERLORD // 06 JUN 1944</div>
        <h1>OMAHA SECTOR — TACTICAL COMMAND</h1>
        <p>洋上の艦隊から歩兵中隊を投入し、海岸堡を確立せよ。</p>
      </div>
      <div class="supply panel">
        <div class="supply-row"><span>補給物資</span><span id="supplyText">0 / 500</span></div>
        <div class="bar"><div id="supplyFill"></div></div>
      </div>
    </div>

    <div id="selection" class="selection panel">
      <strong id="selectionTitle">Rifle Company</strong>
      <span id="selectionMeta">193名</span>
    </div>

    <div class="hint panel">中隊をタップ → 地面をタップで移動<br>ドラッグで視点回転 / ピンチ・ホイールでズーム</div>
    <div id="toast" class="toast panel">命令受領</div>

    <div class="bottom">
      <div class="dock panel">
        <div class="unit-card">
          <div class="name">U.S. RIFLE COMPANY</div>
          <div class="meta">HQ + 3 Rifle Platoons + Weapons Platoon / 193 personnel</div>
        </div>
        <button id="deployBtn" disabled>召喚 100</button>
      </div>
    </div>
  </div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaeb8b1);
scene.fog = new THREE.FogExp2(0x9da7a2, 0.0046);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 78, 92);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, -8);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.minDistance = 42;
controls.maxDistance = 145;
controls.maxPolarAngle = Math.PI * .47;
controls.minPolarAngle = Math.PI * .18;
controls.enablePan = false;

scene.add(new THREE.HemisphereLight(0xd7e0de, 0x4a4335, 1.7));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.0);
sun.position.set(-50, 90, 35); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-100; sun.shadow.camera.right=100; sun.shadow.camera.top=100; sun.shadow.camera.bottom=-100;
scene.add(sun);

const MAP = 120;
const coastZ = 8;

function terrainHeight(x,z){
  if (z < coastZ) return 0;
  const inland = z-coastZ;
  const bluff = 1.2 + Math.min(8, inland*0.16);
  const undulation = Math.sin(x*.11)*0.7 + Math.sin(z*.08+x*.04)*0.5 + Math.cos(x*.035-z*.07)*0.4;
  return bluff + undulation;
}

const terrainGeo = new THREE.PlaneGeometry(MAP, MAP, 70, 70);
terrainGeo.rotateX(-Math.PI/2);
const pos = terrainGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), z=pos.getZ(i);
  pos.setY(i, terrainHeight(x,z));
}
terrainGeo.computeVertexNormals();
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ color:0x68744f, roughness:1, metalness:0 }));
terrain.position.z = MAP/2 - 24;
terrain.receiveShadow = true;
terrain.userData.isGround = true;
scene.add(terrain);

const beach = new THREE.Mesh(new THREE.PlaneGeometry(MAP, 19).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({color:0xb5a77f, roughness:1}));
beach.position.set(0,.12,-1.2); beach.receiveShadow=true; beach.userData.isGround=true; scene.add(beach);

const water = new THREE.Mesh(new THREE.PlaneGeometry(MAP, 82).rotateX(-Math.PI/2), new THREE.MeshPhysicalMaterial({color:0x3d6470, roughness:.28, metalness:.05, transparent:true, opacity:.92}));
water.position.set(0,-.12,-50); scene.add(water);

for(let i=0;i<6;i++){
  const foam=new THREE.Mesh(new THREE.PlaneGeometry(MAP*.94, .18).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color:0xd9dfdc,transparent:true,opacity:.38}));
  foam.position.set(0,.03,-8-i*3.8); scene.add(foam);
}

const hedgeMat = new THREE.MeshStandardMaterial({color:0x31422c, roughness:1});
const roadMat = new THREE.MeshStandardMaterial({color:0x777064, roughness:1});
function hedge(x,z,w,d,rot=0){ const y=terrainHeight(x,z)+1.15; const m=new THREE.Mesh(new THREE.BoxGeometry(w,2.3,d),hedgeMat); m.position.set(x,y,z); m.rotation.y=rot; m.castShadow=true; m.receiveShadow=true; scene.add(m); }
function road(x,z,w,d,rot=0){ const y=terrainHeight(x,z)+.08; const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d).rotateX(-Math.PI/2),roadMat); m.position.set(x,y,z); m.rotation.y=rot; m.receiveShadow=true; scene.add(m); }
for(const z of [22,38,55]){ hedge(-31,z,35,1.4,.05); hedge(29,z+4,42,1.4,-.08); }
for(const x of [-38,-12,18,43]) hedge(x,49,1.4,45,Math.sin(x)*.04);
road(-5,33,4,58,.1); road(28,47,3,44,-.42);

function bunker(x,z){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(8,2.6,5),new THREE.MeshStandardMaterial({color:0x65665d,roughness:1})); base.position.y=1.3; base.castShadow=true; g.add(base);
  const slit=new THREE.Mesh(new THREE.BoxGeometry(4.2,.45,.2),new THREE.MeshBasicMaterial({color:0x1b1c1a})); slit.position.set(0,1.4,-2.58); g.add(slit);
  g.position.set(x,terrainHeight(x,z),z); g.rotation.y=Math.PI; scene.add(g); return g;
}
[-35,-8,26,46].forEach((x,i)=>bunker(x,13+Math.abs(i-1.5)*2));

function makeCarrier(){
  const g=new THREE.Group();
  const hull=new THREE.Mesh(new THREE.BoxGeometry(30,3.8,8),new THREE.MeshStandardMaterial({color:0x343c41,roughness:.72,metalness:.28})); hull.position.y=1.4; hull.castShadow=true; g.add(hull);
  const deck=new THREE.Mesh(new THREE.BoxGeometry(32,.8,9),new THREE.MeshStandardMaterial({color:0x505a5d,roughness:.9})); deck.position.y=3.55; deck.castShadow=true; g.add(deck);
  const island=new THREE.Mesh(new THREE.BoxGeometry(4,5,3),new THREE.MeshStandardMaterial({color:0x475155,roughness:.8})); island.position.set(5,6,1.8); island.castShadow=true; g.add(island);
  g.position.set(0,0,-78); scene.add(g); return g;
}
const carrier=makeCarrier();
for(const x of [-45,-25,28,48]){ const ship=new THREE.Mesh(new THREE.BoxGeometry(11,1.6,3),new THREE.MeshStandardMaterial({color:0x3d464a})); ship.position.set(x,.55,-68-Math.random()*15); ship.rotation.y=(Math.random()-.5)*.25; ship.castShadow=true; scene.add(ship); }

const companyTemplate = { name:'U.S. Rifle Company', strength:193, officers:6, enlisted:187, subunits:['Company HQ','1st Rifle Platoon','2nd Rifle Platoon','3rd Rifle Platoon','Weapons Platoon'], cost:100 };
let supply=30, companySeq=0, selected=null;
const companies=[]; const landingGroups=[];
const deployBtn=document.getElementById('deployBtn'), supplyText=document.getElementById('supplyText'), supplyFill=document.getElementById('supplyFill');
const selection=document.getElementById('selection'), selectionTitle=document.getElementById('selectionTitle'), selectionMeta=document.getElementById('selectionMeta');
const toast=document.getElementById('toast');
function notify(t){toast.textContent=t;toast.classList.add('show');clearTimeout(notify._t);notify._t=setTimeout(()=>toast.classList.remove('show'),1200)}
function updateSupplyUI(){ supply=Math.min(500,supply); supplyText.textContent=`${Math.floor(supply)} / 500`; supplyFill.style.width=`${(supply/500)*100}%`; deployBtn.disabled=supply<companyTemplate.cost; }
function makeLandingCraft(x,z){ const g=new THREE.Group(); const hull=new THREE.Mesh(new THREE.BoxGeometry(3.7,1.0,7),new THREE.MeshStandardMaterial({color:0x68695e,roughness:.85})); hull.position.y=.4; hull.castShadow=true; g.add(hull); const bay=new THREE.Mesh(new THREE.BoxGeometry(2.7,.3,4.4),new THREE.MeshStandardMaterial({color:0x3e413b,roughness:1})); bay.position.set(0,1.02,.1); g.add(bay); g.position.set(x,0,z); scene.add(g); return g; }
function soldierMesh(color=0x647153){ const g=new THREE.Group(); const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.8,4,8),new THREE.MeshStandardMaterial({color,roughness:1})); body.position.y=.7; body.castShadow=true; g.add(body); const helmet=new THREE.Mesh(new THREE.SphereGeometry(.34,8,6,0,Math.PI*2,0,Math.PI*.6),new THREE.MeshStandardMaterial({color:0x586149,roughness:1})); helmet.position.y=1.48; helmet.castShadow=true; g.add(helmet); return g; }
function makeCompanyUnit(id,x,z){
  const root=new THREE.Group(); root.userData.type='company'; root.userData.id=id;
  const positions=[[-1.7,-1],[-.55,-1],[.55,-1],[1.7,-1],[-1.7,.2],[-.55,.2],[.55,.2],[1.7,.2],[-1.2,1.45],[0,1.45],[1.2,1.45]];
  positions.forEach((p,i)=>{ const s=soldierMesh(i===0?0x78856a:0x5f6e50); s.position.set(p[0],0,p[1]); root.add(s); });
  const ring=new THREE.Mesh(new THREE.RingGeometry(3.2,3.55,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xefe1ac,transparent:true,opacity:.85,side:THREE.DoubleSide})); ring.position.y=.08; ring.visible=false; root.add(ring); root.userData.ring=ring;
  root.position.set(x,terrainHeight(x,z),z); root.userData.target=new THREE.Vector3(x,terrainHeight(x,z),z); root.userData.speed=5.4; root.userData.health=100; root.userData.meta={...companyTemplate,id}; scene.add(root); companies.push(root); return root;
}
function deployCompany(){
  if(supply<companyTemplate.cost) return; supply-=companyTemplate.cost; updateSupplyUI(); const id=++companySeq; const craft=[];
  for(let i=0;i<6;i++) craft.push(makeLandingCraft(-10+i*4,-70-(i%2)*5));
  landingGroups.push({id,craft,phase:'sea',progress:0,beachX:-26 + ((id*17)%52),targetZ:-2+((id%3)-1)*2}); notify(`第${id}中隊：上陸開始`);
}
deployBtn.addEventListener('click',deployCompany);

const raycaster=new THREE.Raycaster(); const pointer=new THREE.Vector2(); let pointerDown={x:0,y:0,t:0};
renderer.domElement.addEventListener('pointerdown',e=>{pointerDown={x:e.clientX,y:e.clientY,t:performance.now()}});
renderer.domElement.addEventListener('pointerup',e=>{
  const moved=Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y); if(moved>8) return;
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(pointer,camera);
  const unitHits=raycaster.intersectObjects(companies,true);
  if(unitHits.length){ let o=unitHits[0].object; while(o.parent && o.userData.type!=='company') o=o.parent; if(o.userData.type==='company'){ selectCompany(o); return; } }
  if(selected){ const groundHits=raycaster.intersectObjects([terrain,beach],false); if(groundHits.length){ const p=groundHits[0].point; selected.userData.target.set(p.x,terrainHeight(p.x,p.z),p.z); notify(`第${selected.userData.id}中隊：移動命令`); return; } }
});
function selectCompany(c){ if(selected?.userData.ring) selected.userData.ring.visible=false; selected=c; c.userData.ring.visible=true; const m=c.userData.meta; selection.classList.add('active'); selectionTitle.textContent=`第${m.id}中隊 / ${m.name}`; selectionMeta.textContent=`${m.strength}名｜将校${m.officers}・下士官兵${m.enlisted}｜HQ + 小銃小隊×3 + 火器小隊`; }
function animateLanding(dt){
  for(let i=landingGroups.length-1;i>=0;i--){
    const g=landingGroups[i]; g.progress+=dt;
    if(g.phase==='sea'){
      const t=Math.min(1,g.progress/10.5); const smooth=t*t*(3-2*t);
      g.craft.forEach((c,j)=>{ const sx=-10+j*4, sz=-70-(j%2)*5; c.position.x=THREE.MathUtils.lerp(sx,g.beachX+(j-2.5)*2.1,smooth); c.position.z=THREE.MathUtils.lerp(sz,g.targetZ-6+(j%2)*1.4,smooth); c.rotation.y=THREE.MathUtils.lerp(0,Math.PI*.02,smooth); });
      if(t>=1){ g.phase='unload'; g.progress=0; const unit=makeCompanyUnit(g.id,g.beachX,1.4); unit.scale.setScalar(.01); g.unit=unit; }
    } else if(g.phase==='unload'){
      const t=Math.min(1,g.progress/1.6); g.unit.scale.setScalar(.01 + .99*t); g.craft.forEach(c=>c.position.z-=dt*4.2);
      if(t>=1){ g.craft.forEach(c=>scene.remove(c)); landingGroups.splice(i,1); notify(`第${g.id}中隊：上陸完了`); }
    }
  }
}
function animateCompanies(dt){
  for(const c of companies){ const target=c.userData.target; const flatTarget=new THREE.Vector3(target.x,c.position.y,target.z); const d=flatTarget.clone().sub(c.position); const dist=d.length(); if(dist>.35){ d.normalize(); const step=Math.min(dist,c.userData.speed*dt); c.position.addScaledVector(d,step); c.rotation.y=Math.atan2(d.x,d.z); c.position.y=terrainHeight(c.position.x,c.position.z); } }
}
let last=performance.now();
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(.05,(now-last)/1000); last=now; supply += dt*9; updateSupplyUI(); animateLanding(dt); animateCompanies(dt); controls.update(); water.material.opacity=.90 + Math.sin(now*.0012)*.02; renderer.render(scene,camera); }
updateSupplyUI(); requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
