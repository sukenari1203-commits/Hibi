<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#11110f" />
<title>VENTURE INFO — Gem Collection</title>
<style>
*{box-sizing:border-box}
:root{
  --black:#11110f;--ink:#211b14;--cream:#f5efe4;--paper:#fbf7ef;
  --gold:#c99a2e;--gold2:#e2b646;--line:rgba(74,55,27,.15);--muted:#7b7063;
}
html{background:var(--cream);scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:
  radial-gradient(circle at 12% 6%,rgba(201,154,46,.08),transparent 28%),
  linear-gradient(#f8f2e8,#efe5d6);
  font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.topbar{
  height:72px;position:sticky;top:0;z-index:30;display:grid;
  grid-template-columns:270px 1fr 390px;align-items:center;padding:0 28px;
  background:#0d0e0d;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)
}
.brand{display:flex;gap:11px;align-items:center;color:inherit;text-decoration:none}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;color:#111;border-radius:8px;background:linear-gradient(145deg,#d5af4a,#9e731d);font-size:24px}
.brand strong{display:block;color:#e2b646;font-family:Georgia,serif;font-size:20px;letter-spacing:.06em}
.brand small{display:block;margin-top:2px;color:rgba(255,255,255,.64);font-size:9px;letter-spacing:.13em}
.top-title{text-align:center;color:#d8b351;font-size:10px;font-weight:900;letter-spacing:.18em}
.back-btn{justify-self:end;color:#e2b646;text-decoration:none;border:1px solid rgba(216,169,52,.5);border-radius:999px;padding:9px 13px;font-size:10px}
.hero{padding:46px 5vw 34px;border-bottom:1px solid var(--line);background:
  linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.16)),
  repeating-linear-gradient(90deg,rgba(119,85,35,.025) 0 1px,transparent 1px 18px)}
.eyebrow{margin:0 0 8px;color:#9a6d16;font-size:10px;font-weight:900;letter-spacing:.18em}
.hero h1{margin:0;font:500 clamp(34px,5vw,58px)/1 Georgia,serif;color:#17130f}
.hero p{max-width:740px;margin:13px 0 0;color:#74685a;font-size:12px;line-height:1.75}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:18px 5vw;border-bottom:1px solid var(--line);background:rgba(251,247,239,.8);backdrop-filter:blur(10px)}
.count{font:500 18px Georgia,serif}
.count span{color:#9b6f18}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fffaf1;color:#6a5d4d;padding:8px 10px;font-size:9px;font-weight:800}
.chip.active{background:#15140f;color:#e4b947;border-color:#15140f}
.atlas{padding:30px 5vw 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.specimen{
  position:relative;min-height:270px;border:1px solid rgba(91,65,27,.16);border-radius:14px;
  background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(241,230,212,.78));
  box-shadow:0 16px 40px rgba(56,38,19,.08);overflow:hidden;transition:.2s ease;text-align:left;padding:0
}
.specimen:hover{transform:translateY(-4px);box-shadow:0 22px 48px rgba(56,38,19,.13);border-color:rgba(171,121,24,.35)}
.specimen-top{height:166px;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 70%,rgba(104,74,35,.12),transparent 34%),
  linear-gradient(#f8f1e6,#eadfce);border-bottom:1px solid rgba(85,61,28,.11)}
.gem-wrap{position:relative;width:104px;height:104px;display:grid;place-items:center}
.gem-shadow{position:absolute;left:14px;right:14px;bottom:4px;height:12px;background:radial-gradient(ellipse,rgba(31,21,13,.25),transparent 70%)}
.gem{
  --hue:0deg;width:78px;height:72px;display:grid;place-items:center;color:#fff3ca;
  font:900 18px/1 Georgia,serif;
  clip-path:polygon(50% 0,88% 17%,100% 55%,72% 94%,27% 100%,0 57%,14% 18%);
  background:
    linear-gradient(140deg,rgba(255,255,255,.48),transparent 27%),
    linear-gradient(34deg,rgba(255,228,137,.28),transparent 48%),
    linear-gradient(145deg,#d6a63d,#75501a 76%);
  filter:hue-rotate(var(--hue));
  border-radius:14px;
  box-shadow:inset 0 -9px 16px rgba(40,24,7,.24),0 13px 22px rgba(46,30,13,.23)
}
.gem::after{content:"";width:30px;height:14px;border-radius:50%;border-top:1px solid rgba(255,255,255,.48);transform:rotate(-24deg)}
.specimen-body{padding:16px}
.specimen-body small{display:block;color:#967022;font-size:8px;font-weight:900;letter-spacing:.12em}
.specimen-body h2{margin:6px 0 7px;font:500 18px/1.15 Georgia,serif}
.specimen-body p{margin:0;color:#786b5b;font-size:9px;line-height:1.55}
.depth-tag{position:absolute;top:12px;right:12px;padding:5px 7px;border-radius:99px;background:rgba(17,17,15,.9);color:#e2b646;font-size:8px;font-weight:900}
.empty{grid-column:1/-1;min-height:420px;display:grid;place-items:center;text-align:center;border:1px dashed rgba(91,65,27,.22);border-radius:16px;background:rgba(255,255,255,.3);color:#756858}
.empty b{display:block;margin:12px 0 6px;color:#2d251d;font:500 25px Georgia,serif}
.empty a{display:inline-block;margin-top:14px;color:#111;background:#e0b547;text-decoration:none;padding:11px 14px;border-radius:8px;font-size:10px;font-weight:900}
.dialog{width:min(860px,calc(100vw - 24px));max-height:88vh;overflow:auto;border:1px solid rgba(91,65,27,.22);border-radius:16px;padding:28px;background:#fbf6ec;color:#221a13;box-shadow:0 30px 100px rgba(0,0,0,.32)}
.dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(6px)}
.close{position:absolute;right:15px;top:12px;border:0;background:transparent;color:#6e6255;font-size:24px}
.dhero{display:grid;grid-template-columns:92px 1fr auto;gap:18px;align-items:center;padding-right:30px}
.dgem{width:86px;height:80px;display:grid;place-items:center;color:#fff3ca;font:900 20px Georgia,serif;clip-path:polygon(50% 0,88% 17%,100% 55%,72% 94%,27% 100%,0 57%,14% 18%);background:linear-gradient(145deg,#d6a63d,#75501a 76%);filter:hue-rotate(var(--hue))}
.dkicker{color:#a7791d;font-size:9px;font-weight:900;letter-spacing:.14em}
.dhero h2{margin:5px 0 7px;font:500 34px Georgia,serif}
.dhero p{margin:0;color:#6e6255;font-size:11px;line-height:1.65}
.remove{border:0;border-radius:8px;background:#15140f;color:#e2b646;padding:12px 14px;font-size:9px;font-weight:900}
.snapshot{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:24px 0 18px}
.snap{padding:13px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.6)}
.snap small{display:block;color:#877969;font-size:8px;font-weight:900;letter-spacing:.1em}
.snap strong{display:block;margin-top:7px;font:500 15px Georgia,serif}
.snap span{display:block;margin-top:5px;color:#7d7060;font-size:8px;line-height:1.4}
.tabs{display:flex;gap:3px;overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tab{white-space:nowrap;border:0;background:transparent;color:#746757;padding:13px 11px;font-size:9px;font-weight:800}
.tab.active{color:#815d13;border-bottom:2px solid #c99a2e}
.detail{padding:18px 0}
.summary{color:#41372d;font-size:12px;line-height:1.75}
.fact{display:grid;grid-template-columns:145px 1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid rgba(75,55,27,.1)}
.fact label{color:#7a6d5c;font-size:9px;font-weight:900}
.fact div{font-size:11px;line-height:1.55}
.pill{white-space:nowrap;padding:4px 7px;border-radius:99px;background:#eee4d2;color:#8c681d;font-size:8px;font-weight:900}
.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.source{display:block;padding:10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.48);color:#33291f;text-decoration:none;font-size:9px}
@media(max-width:720px){
  .topbar{height:60px;padding:0 14px;grid-template-columns:1fr auto}.top-title{display:none}.brand strong{font-size:16px}.brand small{display:none}
  .hero{padding:30px 18px 24px}.toolbar{display:block;padding:14px 18px}.filters{margin-top:10px}.atlas{padding:20px 14px 80px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .specimen{min-height:225px}.specimen-top{height:135px}.gem{width:66px;height:62px}.specimen-body{padding:12px}.specimen-body h2{font-size:14px}.specimen-body p{font-size:8px}
  .dialog{padding:22px 16px}.dhero{grid-template-columns:68px 1fr}.dgem{width:64px;height:60px}.dhero h2{font-size:26px}.remove{grid-column:1/-1}.snapshot{grid-template-columns:repeat(2,1fr)}
  .fact{grid-template-columns:90px 1fr}.pill{grid-column:2;justify-self:start}.sources{grid-template-columns:1fr}
}


/* V7 collection: same angular ore language as the quarry */
.gem, .dgem{
  border-radius:0 !important;
  clip-path:var(--ore-shape, polygon(50% 0%,88% 17%,100% 55%,72% 94%,27% 100%,0 57%,14% 18%)) !important;
}
.gem{
  position:relative;
  width:80px !important;
  height:74px !important;
  display:grid !important;
  place-items:center !important;
  color:transparent !important;
  overflow:visible;
}
.gem img,.dgem img{
  width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
}
.gem.legendary,.dgem.legendary{
  background:linear-gradient(120deg,#ff5b6e,#ffcf4d,#75ff8a,#58e7ff,#7285ff,#d96fff,#ff6cae) !important;
  background-size:280% 280% !important;
  animation:atlasRainbow 3.2s ease-in-out infinite;
  box-shadow:0 0 10px rgba(255,255,255,.75),0 0 22px rgba(85,221,255,.48),0 0 34px rgba(218,96,255,.28) !important;
}
.gem.legendary::before,.dgem.legendary::before{
  content:"✦";
  position:absolute;left:-10px;top:-8px;color:white;font-size:14px;
  text-shadow:72px 10px 0 #fff7ac,54px 63px 0 #8ff8ff,-1px 59px 0 #ffaef7;
  animation:atlasSparkle 1.35s ease-in-out infinite alternate;
}
@keyframes atlasRainbow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes atlasSparkle{0%{opacity:.2;transform:scale(.6)}60%{opacity:1;transform:scale(1.3)}100%{opacity:.45;transform:scale(.8)}}

.specimen.silver .gem{background:linear-gradient(135deg,#f4f6f8,#9ba3ab 27%,#edf0f2 52%,#6b737b 78%,#cfd4d8)!important;filter:none!important;color:#2e3338!important}.specimen.silver .depth-tag{background:#626a72;color:#fff}.dgem.silver{background:linear-gradient(135deg,#f4f6f8,#9ba3ab 27%,#edf0f2 52%,#6b737b 78%,#cfd4d8)!important;color:#2e3338!important;filter:none!important}.specimen.silver .gem img,.dgem.silver img{filter:grayscale(1)}

.atlas-modes{display:flex;gap:6px;margin-top:9px}.mode-chip{border:1px solid var(--line);border-radius:999px;background:#fffaf1;padding:7px 11px;font-size:9px;font-weight:900;color:#6b5b46}.mode-chip.active{background:#11110f;color:#e3b849;border-color:#11110f}.tool-atlas{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tool-card{min-height:320px;padding:24px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#fffaf1,#eadfce);position:relative;text-align:left}.tool-card.locked{filter:grayscale(.65);opacity:.62}.tool-icon{height:145px;display:grid;place-items:center;font-size:74px}.tool-card h2{font:500 24px Georgia,serif;margin:8px 0}.tool-card p{font-size:10px;line-height:1.65;color:#706453}.tool-badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#15140f;color:#e3b849;font-size:8px;font-weight:900}.tool-card.current{outline:2px solid #d2a337;box-shadow:0 18px 45px rgba(140,99,23,.16)}@media(max-width:720px){.tool-atlas{grid-template-columns:1fr}.tool-card{min-height:240px}.tool-icon{height:100px}}
</style>
</head>

function hashHue(text){
  let h=0; for(const ch of text) h=(h*31+ch.charCodeAt(0))>>>0;
  return `${(h%300)-150}deg`;
}
function initials(name){
  return String(name||"VI").split(/\s+/).map(x=>x[0]).join("").replace(/\W/g,"").slice(0,2).toUpperCase()||"VI";
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
async function track(eventType, payload={}){
  if(!sessionId) return;
  try{
    await fetch(`${ANALYTICS_CONFIG.supabaseUrl}/rest/v1/events`,{
      method:"POST",
      headers:{
        apikey:ANALYTICS_CONFIG.publishableKey,
        Authorization:`Bearer ${ANALYTICS_CONFIG.publishableKey}`,
        "Content-Type":"application/json",
        Prefer:"return=minimal"
      },
      body:JSON.stringify([{
        session_id:sessionId,event_type:eventType,
        industry:payload.industry||null,company:payload.company||null,
        x_position:null,depth_m:Number.isFinite(payload.depth_m)?payload.depth_m:null,
        metadata:payload.metadata||{}
      }])
    });
  }catch(_){}
}

function renderTools(){
  const atlas=document.getElementById("atlas");
  const level=Math.max(1,Math.min(100,Number(localStorage.getItem("vi-dig-level-v2")||1)));
  document.getElementById("filters").style.display="none";
  const handIcon=`<svg viewBox="0 0 90 90" width="88" height="88" aria-hidden="true"><path d="M30 69C19 56 15 44 20 36c4-5 9-1 13 4V19c0-7 9-7 9 0v17-23c0-7 9-7 9 0v23-19c0-7 9-7 9 0v21-13c0-7 9-7 9 0v25c8-5 14-2 11 7l-7 18c-3 8-11 12-20 12h-5c-8 0-14-7-18-18z" fill="#d7aa7d" stroke="#5a3820" stroke-width="3"/></svg>`;
  const shovelIcon=`<svg viewBox="0 0 90 90" width="88" height="88" aria-hidden="true"><g transform="rotate(-28 45 45)"><path d="M37 8Q45 0 53 8l-3 10H40z" fill="#df3835" stroke="#711a17" stroke-width="3"/><rect x="41" y="15" width="9" height="43" rx="4" fill="#df3835" stroke="#711a17" stroke-width="3"/><path d="M27 55Q45 44 63 55l-4 22Q45 88 31 77z" fill="#dce1e5" stroke="#535b61" stroke-width="4"/></g></svg>`;
  const drillIcon=`<svg viewBox="0 0 90 90" width="88" height="88" aria-hidden="true"><g transform="rotate(-20 45 45)"><path d="M12 25h49c9 0 14 6 14 14v13H27c-9 0-15-7-15-15z" fill="#e2ad32" stroke="#4f421e" stroke-width="3"/><path d="M34 52h22l-5 30H34z" fill="#222"/><path d="M75 35h9l6 5-6 5h-9z" fill="#cbd1d5" stroke="#555" stroke-width="3"/><circle cx="29" cy="38" r="7" fill="#ffe27a"/></g></svg>`;
  const tools=[
    {id:"hand",name:"手掘り",unlock:1,icon:handIcon,desc:"最初の採掘方法。狭い範囲を少しずつ掘り進める。"},
    {id:"shovel",name:"赤柄シャベル",unlock:50,icon:shovelIcon,desc:"Lv.50で解放。手掘りより広い範囲を一度に掘れる。"},
    {id:"drill",name:"ドリル",unlock:100,icon:drillIcon,desc:"Lv.100で解放される最上位道具。最も大きな掘削範囲を持つ。"}
  ];
  const current=level>=100?"drill":level>=50?"shovel":"hand";
  atlas.innerHTML=`<div class="tool-atlas">${tools.map(x=>{const unlocked=level>=x.unlock;return `<article class="tool-card ${unlocked?"":"locked"} ${current===x.id?"current":""}"><span class="tool-badge">${unlocked?(current===x.id?"使用中":"UNLOCKED"):`Lv.${x.unlock}で解放`}</span><div class="tool-icon">${x.icon}</div><h2>${x.name}</h2><p>${x.desc}</p><p>現在の採掘レベル：Lv.${level}</p></article>`}).join("")}</div>`;
}
function setAtlasMode(mode){
  activeMode=mode;
  document.querySelectorAll(".mode-chip").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  document.getElementById("filters").style.display=mode==="ores"?"flex":"none";
  if(mode==="tools") renderTools(); else renderAtlas();
}

  const el=document.getElementById("filters");
  el.innerHTML=`<button class="chip active" data-filter="ALL">すべて</button>`+
    industries.map(i=>`<button class="chip" data-filter="${esc(i)}">${esc(i)}</button>`).join("");
  el.querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{
    activeFilter=btn.dataset.filter;
    el.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===btn));
    renderAtlas();
  }));
}
function savedCompanies(){
  return catalog.filter(c=>saved.has(c.name)&&(activeFilter==="ALL"||c.industry===activeFilter));
}
function renderAtlas(){
  if(activeMode==="tools"){renderTools();return;}
  document.getElementById("filters").style.display="flex";
  const atlas=document.getElementById("atlas");
  const rows=savedCompanies();
  document.getElementById("count").textContent=saved.size;

  if(!catalog.length){
    atlas.innerHTML=`<div class="empty"><div><div style="font-size:46px;color:#c79b3c">◇</div><b>企業データを準備中</b><div>最新版の採掘場を一度開いてから、図鑑へ戻ってください。</div><a href="${mineHref()}">採掘場を開く</a></div></div>`;
    return;
  }
  if(!rows.length){
    atlas.innerHTML=`<div class="empty"><div><div style="font-size:46px;color:#c79b3c">◇</div><b>${saved.size?"この業界の鉱石はまだありません":"まだ鉱石がありません"}</b><div>気になる企業を発見したら「コレクションに保存」してください。</div><a href="${mineHref()}">採掘に戻る</a></div></div>`;
    return;
  }
  atlas.innerHTML=rows.map(c=>`
    <button class="specimen ${c.sme?"silver":""}" data-company="${esc(c.name)}">
      <span class="depth-tag">${c.sme?"SME LINE":`-${esc(playableDepth(c))}m${c.legendary?" · GAFA":""}`}</span>
      <div class="specimen-top">
        <div class="gem-wrap">
          <div class="gem-shadow"></div>
          <div class="gem${c.legendary?" legendary":""}" style="--hue:${hashHue(c.industry+c.name)};--ore-shape:${oreShapeFor(c.name)}">${c.sme?"SME":(iconFor(c)?`<img src="${iconFor(c)}" alt="" aria-hidden="true">`:initials(c.name))}</div>
        </div>
      </div>
      <div class="specimen-body">
        <small>${esc(c.industry)}</small>
        <h2>${esc(c.displayName)}</h2>
        <p>${esc(c.summary)}</p>
      </div>
    </button>`).join("");

  atlas.querySelectorAll("[data-company]").forEach(btn=>btn.addEventListener("click",()=>{
    const c=catalog.find(x=>x.name===btn.dataset.company); if(c) openCompany(c);
  }));
}

const VERIFIED_COLLECTION_POC = new Set(["Sony Group","ITOCHU","Hitachi"]);
const verifiedCollectionCache = new Map();
function sourceTypeLabel(t){
  return ({official_site:"企業公式",official_recruit:"公式採用",official_ir:"公式IR",annual_securities_report:"有価証券報告書",integrated_report:"統合報告書",public_agency:"公的機関"})[t]||"公開情報";
}
function renderVerifiedCollectionDetail(c,key){
  const groups=window.VICompanyData?.group(c.__verifiedProfile)||[];
  const group=groups.find(g=>g.key===key)||groups[0];
  const detail=document.getElementById("detail");
  if(!group){detail.innerHTML="";return}
  const q=window.VICompanyData.quality(c.__verifiedProfile);
  detail.innerHTML=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px">
    <span class="pill">Verified ${q.verifiedFields}</span><span class="pill">Source ${q.sourceCoverageRate}%</span><span class="pill">High ${q.highConfidenceRate}%</span>
  </div>`+group.points.map(p=>`<div class="fact"><label>${esc(p.label)}</label><div>${esc(p.display_value)}</div><a class="pill" href="${esc(p.source_url)}" target="_blank" rel="noopener">${esc(sourceTypeLabel(p.source_type))} ↗</a></div>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===group.key));
}
function applyCollectionVerified(c,profile){
  c.__verifiedProfile=profile;
  const groups=window.VICompanyData.group(profile);
  if(!groups.length)return;
  const verifiedIndustry=window.VICompanyData.point(profile,"industry");if(verifiedIndustry)document.getElementById("dialogIndustry").textContent=verifiedIndustry.display_value;
  const business=window.VICompanyData.point(profile,"business_description");
  if(business)document.getElementById("dialogSummary").textContent=business.display_value;
  const wanted=["starting_salary","annual_holidays","employee_count_consolidated","employee_count","revenue"];
  const pts=[]; const seen=new Set();
  wanted.forEach(k=>{const x=window.VICompanyData.point(profile,k);if(x&&!seen.has(x.field_name)&&pts.length<4){seen.add(x.field_name);pts.push(x)}});
  document.getElementById("snapshot").innerHTML=pts.map(x=>`<div class="snap"><small>${esc(window.VICompanyData.fieldMeta[x.field_name]?.[1]||x.field_name)}</small><strong>${esc(x.display_value)}</strong><span>${esc(sourceTypeLabel(x.source_type))}</span></div>`).join("");
  document.getElementById("tabs").innerHTML=groups.map((g,i)=>`<button class="tab ${i===0?"active":""}" data-tab="${esc(g.key)}">${esc(g.label)}</button>`).join("");
  document.getElementById("tabs").querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>renderVerifiedCollectionDetail(c,btn.dataset.tab)));
  document.getElementById("sources").innerHTML=window.VICompanyData.uniqueSources(profile).map(s=>`<a class="source" href="${esc(s.source_url)}" target="_blank" rel="noopener"><b>${esc(s.source_title||sourceTypeLabel(s.source_type))}</b><br>${esc(sourceTypeLabel(s.source_type))} · high ↗</a>`).join("");
  renderVerifiedCollectionDetail(c,groups[0].key);
}
async function loadCollectionVerified(c){
  if(!window.VICompanyData)return;
  try{
    let profile=verifiedCollectionCache.get(c.name);
    if(profile===undefined){profile=await window.VICompanyData.fetchVerifiedProfile(c.name);verifiedCollectionCache.set(c.name,profile||null)}
    if(selected!==c)return;
    if(profile?.data_points?.length)applyCollectionVerified(c,profile);
    else if(VERIFIED_COLLECTION_POC.has(c.name)){
      document.getElementById("dialogSummary").textContent="Verified DataのSupabase migration適用後、根拠確認済み情報だけを表示します。";
      document.getElementById("snapshot").innerHTML="";document.getElementById("tabs").innerHTML="";document.getElementById("detail").innerHTML="";document.getElementById("sources").innerHTML="";
    }
  }catch(e){
    console.warn("verified collection profile failed",e);
    if(VERIFIED_COLLECTION_POC.has(c.name)&&selected===c){
      document.getElementById("dialogSummary").textContent="確認済み企業データの読み込みに失敗しました。推測データは表示しません。";
      document.getElementById("snapshot").innerHTML="";document.getElementById("tabs").innerHTML="";document.getElementById("detail").innerHTML="";document.getElementById("sources").innerHTML="";
    }
  }
}

function detailKeys(c){
  const order=["compensation","benefits","stability","culture","workstyle","career"];
  return order.filter(k=>c.details&&c.details[k]);
}
const labels={compensation:"給料・待遇",benefits:"福利厚生",stability:"経営安定性",culture:"社風・人間関係",workstyle:"働き方",career:"成長・キャリア"};
function renderDetail(c,key){
  if(c.__verifiedProfile){renderVerifiedCollectionDetail(c,key);return;}
  const section=c.details?.[key];
  const detail=document.getElementById("detail");
  if(!section){detail.innerHTML="";return}
  detail.innerHTML=`<p class="summary">${esc(section.summary)}</p>`+
    (section.facts||[]).map(row=>`<div class="fact"><label>${esc(row[0])}</label><div>${esc(row[1])}</div><span class="pill">${esc(row[2])}</span></div>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===key));
}
function openCompany(c){
  selected=c;
  c.__verifiedProfile=null;
  const dialogGem=document.getElementById("dialogGem");
  dialogGem.className=`dgem${c.legendary?" legendary":""}${c.sme?" silver":""}`;
  dialogGem.style.setProperty("--hue",hashHue(c.industry+c.name));
  dialogGem.style.setProperty("--ore-shape",oreShapeFor(c.name));
  dialogGem.innerHTML=c.sme?"SME":(iconFor(c)?`<img src="${iconFor(c)}" alt="" aria-hidden="true">`:initials(c.name));
  document.getElementById("dialogIndustry").textContent=c.industry||"";
  document.getElementById("dialogName").textContent=c.displayName||c.name;
  document.getElementById("dialogSummary").textContent=c.summary||"";
  if(VERIFIED_COLLECTION_POC.has(c.name)){
    document.getElementById("dialogSummary").textContent="確認済み公開情報を読み込んでいます…";
    document.getElementById("snapshot").innerHTML="";
    document.getElementById("tabs").innerHTML="";
    document.getElementById("detail").innerHTML="";
    document.getElementById("sources").innerHTML="";
  }else{
    document.getElementById("snapshot").innerHTML=(c.snapshot||[]).map(s=>`<div class="snap"><small>${esc(s[0])}</small><strong>${esc(s[1])}</strong><span>${esc(s[2])}</span></div>`).join("");
    const keys=detailKeys(c);
    document.getElementById("tabs").innerHTML=keys.map((k,i)=>`<button class="tab ${i===0?"active":""}" data-tab="${k}">${labels[k]||k}</button>`).join("");
    document.getElementById("tabs").querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>renderDetail(c,btn.dataset.tab)));
    renderDetail(c,keys[0]);
    document.getElementById("sources").innerHTML=(c.sources||[]).map(s=>`<a class="source" href="${esc(s[2])}" target="_blank" rel="noopener"><b>${esc(s[0])}</b><br>${esc(s[1])} ↗</a>`).join("");
  }
  document.getElementById("companyDialog").showModal();
  loadCollectionVerified(c);
  track("company_opened",{industry:c.industry,company:c.displayName,depth_m:c.depth,metadata:{source:"collection_atlas"}});
}
document.getElementById("closeDialog").addEventListener("click",()=>document.getElementById("companyDialog").close());
document.getElementById("removeBtn").addEventListener("click",()=>{
  if(!selected)return;
  saved.delete(selected.name);
  localStorage.setItem("vi-major-saved-v2",JSON.stringify([...savedMain]));
  localStorage.setItem("vi-sme-saved-v1",JSON.stringify([...savedSme]));
  track(selected.sme?"sme_company_removed":"company_removed",{industry:selected.industry,company:selected.displayName,depth_m:selected.depth,metadata:{source:"collection_atlas"}});
  document.getElementById("companyDialog").close();
  renderAtlas();
});
document.querySelectorAll(".mode-chip").forEach(b=>b.addEventListener("click",()=>setAtlasMode(b.dataset.mode)));
renderFilters();
renderAtlas();
track("collection_viewed",{metadata:{saved_count:saved.size}});
</script>
</body>
</html>
