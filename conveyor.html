function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function rand(a,b){return a+Math.random()*(b-a)} function pick(a){return a[Math.floor(Math.random()*a.length)]}
function unsaved(){return SME_CATALOG.filter(c=>!saved.has(c.name))} function updateRemaining(){document.getElementById("remaining").textContent=unsaved().length}
function spawnOre(){const pool=unsaved().filter(c=>!active.has(c.name));if(!pool.length)return;const c=pick(pool),el=document.createElement("button");el.className="ore";el.dataset.company=c.name;el.style.setProperty("--shape",pick(shapes));el.style.setProperty("--dur",`${rand(17,24).toFixed(2)}s`);el.style.top=`calc(55% - ${rand(62,82).toFixed(0)}px)`;el.innerHTML=`<span class="glyph">${esc(glyphs[c.industry]||"◇")}</span><span class="mini">${esc(c.displayName)}</span>`;el.addEventListener("click",e=>{e.preventDefault();openCompany(c)});el.addEventListener("animationend",()=>{active.delete(c.name);el.remove()});document.getElementById("oreLayer").appendChild(el);active.set(c.name,el)}

function renderConveyorVerified(c,key){
  const groups=window.VICompanyData?.group(c.__verifiedProfile)||[],g=groups.find(x=>x.key===key)||groups[0],box=document.getElementById("detail");
  if(!g){box.innerHTML="";return}
  box.innerHTML=g.points.map(p=>`<div class="fact"><label>${esc(p.label)}</label><div>${esc(p.display_value)}</div><a class="pill" href="${esc(p.source_url)}" target="_blank" rel="noopener">${esc(conveyorSourceLabel(p.source_type))} ↗</a></div>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===g.key));
}
function applyConveyorVerified(c,p){
  c.__verifiedProfile=p;const groups=window.VICompanyData.group(p);if(!groups.length)return;
  const vi=window.VICompanyData.point(p,"industry");if(vi)document.getElementById("dialogIndustry").textContent=vi.display_value;
  const b=window.VICompanyData.point(p,"business_description");document.getElementById("dialogSummary").textContent=b?b.display_value:"";
  const wanted=["base_salary","starting_salary","annual_holidays","employee_count","revenue"],snap=[];
  wanted.forEach(k=>{const x=window.VICompanyData.point(p,k);if(x&&snap.length<4)snap.push(x)});
  document.getElementById("snapshot").innerHTML=snap.map(x=>{
    const isSalary=x.field_name==="base_salary"||x.field_name==="starting_salary";
    return `<div class="snap ${isSalary?"salary-highlight":""}"><small>${esc(window.VICompanyData.fieldMeta[x.field_name]?.[1]||x.field_name)}</small><strong>${esc(x.display_value)}</strong><span>${esc(conveyorSourceLabel(x.source_type))}</span></div>`;
  }).join("");
  document.getElementById("tabs").innerHTML=groups.map((g,i)=>`<button class="tab ${i?"":"active"}" data-tab="${esc(g.key)}">${esc(g.label)}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>renderConveyorVerified(c,b.dataset.tab)));
  document.getElementById("sources").innerHTML=window.VICompanyData.uniqueSources(p).map(s=>`<a class="source" href="${esc(s.source_url)}" target="_blank" rel="noopener"><b>${esc(s.source_title||conveyorSourceLabel(s.source_type))}</b><br>${esc(conveyorSourceLabel(s.source_type))} · high ↗</a>`).join("");
  renderConveyorVerified(c,groups[0].key);
}
async function loadConveyorVerified(c){
  if(!window.VICompanyData)return;
  try{
    let p=conveyorVerifiedCache.get(c.name);
    if(p===undefined){p=await window.VICompanyData.fetchVerifiedProfile(c.name);conveyorVerifiedCache.set(c.name,p||null)}
    if(selected!==c)return;
    if(p?.data_points?.length){applyConveyorVerified(c,p);return}
    document.getElementById("dialogSummary").textContent="公開できる確認済みデータが現在登録されていません。";
    document.getElementById("snapshot").innerHTML="";document.getElementById("tabs").innerHTML="";document.getElementById("detail").innerHTML="";document.getElementById("sources").innerHTML="";
  }catch(e){
    console.warn("verified SME profile load failed",e);
    if(selected===c){document.getElementById("dialogSummary").textContent="確認済み企業データの読み込みに失敗しました。旧データにはフォールバックしません。";document.getElementById("snapshot").innerHTML="";document.getElementById("tabs").innerHTML="";document.getElementById("detail").innerHTML="";document.getElementById("sources").innerHTML="";}
  }
}
